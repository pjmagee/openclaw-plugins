name: CI

on:
  push:
    branches: [main]
    tags: ["*-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Wake-gate canonical copy guard
        # xai-realtime-voice vendors the wake-gate module; it must stay
        # byte-identical to the canonical copy the tests pin.
        run: cmp plugins/whisper-wake-gate/wake-gate.ts plugins/xai-realtime-voice/local-wake-gate.ts
      - name: Pack every plugin
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            npm pack "./$dir"
          done
      - name: Manifest / package version agreement
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            pkg=$(node -p "require('./${dir}package.json').version")
            man=$(node -p "require('./${dir}openclaw.plugin.json').version")
            if [ "$pkg" != "$man" ]; then
              echo "::error::${dir} version mismatch: package.json=$pkg openclaw.plugin.json=$man"
              exit 1
            fi
          done

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack tagged plugin and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          id="${tag%-v*}"
          version="${tag##*-v}"
          if [ ! -d "plugins/$id" ]; then
            echo "::error::tag $tag does not name a directory under plugins/"
            exit 1
          fi
          # A released version must be exactly what the tree says it is —
          # never republish different bytes under an already-released version.
          pkg_version=$(node -p "require('./plugins/$id/package.json').version")
          man_version=$(node -p "require('./plugins/$id/openclaw.plugin.json').version")
          if [ "$pkg_version" != "$version" ] || [ "$man_version" != "$version" ]; then
            echo "::error::tag says $version but package.json=$pkg_version openclaw.plugin.json=$man_version"
            exit 1
          fi
          pkg_name=$(node -p "require('./plugins/$id/package.json').name")
          npm pack "./plugins/$id"
          tarball="${pkg_name}-${version}.tgz"
          test -f "$tarball"
          sha256sum "$tarball" > "${tarball}.sha256"
          gh release create "$tag" "$tarball" "${tarball}.sha256" \
            --title "$id v$version" \
            --notes "\`openclaw plugins install ./$tarball\` — see [plugins/$id/README.md](https://github.com/${GITHUB_REPOSITORY}/tree/main/plugins/$id) for config."
